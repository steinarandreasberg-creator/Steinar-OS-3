<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Vurderinger · Steinar OS</title>

<!--
  PLACEHOLDER — denne siden er ikke designet ennå.

  Den gjør to ting inntil videre:
   1. lister opp kommende vurderinger fra den cachede kalenderdataen
   2. gir en knapp for å hente kalenderen på nytt (krever brukerklikk,
      ellers blokkerer nettleseren Google-popupen)

  Punkt 2 er hvordan du oppdaterer dataen etter at du har endret
  treningsplanene dine. Hovedskjermen spør aldri om innlogging av seg selv.
-->

<script>
const LS = { theme: 'sos3-theme', gtoken: 'sos3-gtoken', calendar: 'sos3-cal' };
const GOOGLE_CLIENT_ID = '317129810780-q75l1ktememfqqf5brtqdmf8gldj5ctf.apps.googleusercontent.com';
const GOOGLE_SCOPE = 'https://www.googleapis.com/auth/calendar.readonly';
const TZ = 'Europe/Oslo';

(function () {
  var choice = 'auto';
  try { choice = localStorage.getItem(LS.theme) || 'auto'; } catch (e) {}
  var resolved = (choice === 'light' || choice === 'dark') ? choice
    : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = resolved;
})();
</script>

<style>
@font-face {
  font-family: 'Outfit';
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
  src: url('assets/fonts/outfit-var.woff2') format('woff2');
}
@font-face {
  font-family: 'Instrument Serif';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url('assets/fonts/instrument-serif-400.woff2') format('woff2');
}

:root[data-theme='light'] { --bg: #eef2f6; --fg: #1a2833; --muted: #61707d; --line: #d3dce4; --tile: #fff; }
:root[data-theme='dark']  { --bg: #0d1219; --fg: #e8eef6; --muted: #7d8b9c; --line: #1e2833; --tile: #131b25; }

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 64px 38px;
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Outfit', system-ui, sans-serif;
  font-weight: 300;
}

main { max-width: 560px; margin: 0 auto; }

h1 {
  font-family: 'Instrument Serif', serif;
  font-weight: 400;
  font-size: 46px;
  line-height: 1.06;
  margin: 0 0 8px;
}

.note { color: var(--muted); font-size: 13px; margin: 0 0 32px; }

.row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 16px;
  background: var(--tile);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 8px;
}

.row-title { font-size: 15px; }
.row-meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
.row-days { font-size: 15px; font-variant-numeric: tabular-nums; }

.empty { color: var(--muted); font-size: 14px; padding: 14px 0; }

.actions { margin-top: 32px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

button {
  appearance: none;
  font-family: inherit;
  font-size: 13px;
  font-weight: 400;
  padding: 9px 16px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--tile);
  color: var(--fg);
  cursor: pointer;
}

button:disabled { opacity: 0.5; cursor: default; }

a { color: var(--muted); font-size: 13px; }
.status { color: var(--muted); font-size: 12px; }
</style>
</head>

<body>
<main>
  <h1>Vurderinger</h1>
  <p class="note">Denne siden er ikke designet ennå.</p>

  <div id="list"></div>

  <div class="actions">
    <button type="button" id="refresh">Oppdater fra Google Kalender</button>
    <a href="/">← Tilbake</a>
    <span class="status" id="status"></span>
  </div>
</main>

<script>
const fmtISO = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
const fmtLong = new Intl.DateTimeFormat('nb-NO', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' });

const toUtc = k => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const today = () => fmtISO.format(new Date());
const daysUntil = k => Math.round((toUtc(k) - toUtc(today())) / 86400000);
const longDate = k => fmtLong.format(toUtc(k) + 12 * 3600000);

const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (_) { return null; } };

const elList = document.getElementById('list');
const elStatus = document.getElementById('status');
const elRefresh = document.getElementById('refresh');

function render() {
  const cal = lsGet(LS.calendar);
  const upcoming = (cal?.assessments || []).filter(a => a.date >= today());

  if (!upcoming.length) {
    elList.innerHTML = '<p class="empty">Ingen vurderinger i cachen. Trykk «Oppdater» for å hente dem.</p>';
  } else {
    elList.replaceChildren(...upcoming.map(a => {
      const days = daysUntil(a.date);
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML =
        '<div><div class="row-title"></div><div class="row-meta"></div></div><div class="row-days"></div>';
      row.querySelector('.row-title').textContent = a.title;
      row.querySelector('.row-meta').textContent = longDate(a.date);
      row.querySelector('.row-days').textContent = days === 0 ? 'i dag' : `${days} ${days === 1 ? 'dag' : 'dager'}`;
      return row;
    }));
  }

  elStatus.textContent = cal?.fetchedAt
    ? `Hentet ${new Date(cal.fetchedAt).toLocaleString('nb-NO')}`
    : '';
}

elRefresh.addEventListener('click', async () => {
  elRefresh.disabled = true;
  elStatus.textContent = 'Henter…';
  try {
    // Hovedskjermen eier hentelogikken. Her gjenbruker vi den ved å gi
    // index.html beskjed om å hente på nytt neste gang den lastes — men vi
    // gjør selve OAuth-klikket her, hvor brukeren faktisk trykker.
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true;
      s.onload = resolve;
      s.onerror = () => reject(new Error('Fikk ikke lastet Google-skriptet'));
      document.head.appendChild(s);
    });

    const token = await new Promise(resolve => {
      google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: GOOGLE_SCOPE,
        callback: r => resolve(r?.access_token || null),
      }).requestAccessToken();
    });

    if (!token) throw new Error('Ingen tilgang gitt');

    // Ugyldiggjør cachen og lagre tokenet. Hovedskjermen henter 12-måneders-
    // vinduet på nytt ved neste innlasting.
    localStorage.setItem(LS.gtoken, JSON.stringify({ token, expires: Date.now() + 3000 * 1000 }));
    const cal = lsGet(LS.calendar);
    if (cal) { cal.fetchedAt = 0; localStorage.setItem(LS.calendar, JSON.stringify(cal)); }

    elStatus.textContent = 'Klar — går tilbake…';
    location.href = '/';
  } catch (err) {
    elStatus.textContent = err.message;
    elRefresh.disabled = false;
  }
});

render();
</script>
</body>
</html>
