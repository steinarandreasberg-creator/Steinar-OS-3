<!-- Tema leses synkront før første paint. Ingen blink av feil tema. -->
<script>
(function () {
  var choice = 'auto';
  try { choice = localStorage.getItem(LS.theme) || 'auto'; } catch (e) {}
  if (choice !== 'light' && choice !== 'dark') choice = 'auto';
  var resolved = choice === 'auto'
    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : choice;

  var root = document.documentElement;
  root.dataset.theme = resolved;
  root.dataset.themeChoice = choice;

  // Preload det aktive bakgrunnsbildet. type-attributtet gjør at nettlesere
  // uten AVIF-støtte hopper over preloaden og lar <picture> velge WebP.
  var link = document.createElement('link');
  link.rel = 'preload';
  link.as = 'image';
  link.type = 'image/avif';
  link.href = BACKGROUNDS[resolved].avif;
  link.fetchPriority = 'high';
  document.head.appendChild(link);
})();
</script>

/* ── Base ─────────────────────────────────────────────────────────── */
* { box-sizing: border-box; }

.bg, .bg img, .scrim { position: absolute; inset: 0; }

.topbar {

.column-edit {

  appearance: none;
  border: 0;

  padding: 0;

.tile:hover { background: var(--tile-bg-hover); transform: translateY(-1px); }

/* ── Editor for snarveier/prosjekter ─────────────────────────────────
   Bygges i DOM kun når blyantknappen trykkes — null vekt ved vanlig
   innlasting av siden. */
.editor-overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: var(--editor-scrim);
  animation: sos-fade 120ms ease-out;
}

.editor-panel {
  width: 100%;
  max-width: 420px;
  max-height: 80vh;
  overflow-y: auto;
  border-radius: 22px;
  padding: 22px;
  background: var(--editor-bg);
  color: var(--editor-fg);
  border: 1px solid var(--editor-border);
  box-shadow: var(--editor-shadow);
  font-family: 'Outfit', system-ui, sans-serif;
}

.editor-title {
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 16px;
}

.editor-rows {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 6px;
}

.editor-row {
  display: grid;
  grid-template-columns: 1fr 1.4fr auto;
  gap: 6px;
  align-items: center;
}

.editor-input {
  width: 100%;
  min-width: 0;
  font-family: inherit;
  font-size: 13px;
  font-weight: 300;
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--editor-input-bg);
  border: 1px solid var(--editor-border);
  color: var(--editor-fg);
  outline: none;
}

.editor-input:focus { border-color: var(--editor-fg); }

.editor-remove {
  flex: none;
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--editor-muted);
  font-size: 17px;
  line-height: 1;
  padding: 4px 6px;
  border-radius: 8px;
  cursor: pointer;
}

.editor-remove:hover { color: var(--editor-fg); background: var(--editor-input-bg); }

.editor-add {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--editor-muted);
  font-family: inherit;
  font-size: 12px;
  font-weight: 400;
  padding: 8px 2px;
  margin-bottom: 14px;
  cursor: pointer;
}

.editor-add:hover { color: var(--editor-fg); }

.editor-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.editor-actions button {
  appearance: none;
  font-family: inherit;
  font-size: 12px;
  font-weight: 400;
  padding: 8px 16px;
  border-radius: 999px;
  cursor: pointer;
  border: 1px solid var(--editor-border);
  background: transparent;
  color: var(--editor-fg);
}

.editor-cancel:hover { background: var(--editor-input-bg); }

.editor-save {
  background: var(--editor-fg);
  color: var(--editor-bg);
  border-color: transparent;
}

.editor-save:hover { opacity: 0.88; }

/* Innhold som kommer fra nett/cache fades inn på 120 ms. Ingen annen
   innlastingsanimasjon. */
@keyframes sos-fade { from { opacity: 0; } to { opacity: 1; } }
.fade-in { animation: sos-fade 120ms ease-out; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ── Responsivt ───────────────────────────────────────────────────── */
@media (max-width: 1280px) {
  :root { --col-w: 148px; }
  .wordmark { font-size: 96px; }
}

@media (max-width: 1100px) {
  :root { --col-w: var(--col-w-min); }
  .wordmark { font-size: 78px; }
  .cards { flex-direction: column; align-items: center; gap: 12px; }
  .column { bottom: 400px; }
  .sentence { display: none; }
}

@media (max-width: 820px) {
  :root { --side: 22px; }
  .wordmark { font-size: 58px; top: 34px; }
  .column { top: 148px; }
}
</style>

<body>
<div class="stage">

  <!-- Bakgrunn: ett utbyttbart bildelag (se BACKGROUNDS i config). -->
  <picture class="bg">
    <source id="bg-avif" type="image/avif">
    <source id="bg-webp" type="image/webp">
    <img id="bg-img" alt="" decoding="async" fetchpriority="high">

  <script>

    (function () {

    <div class="themebar" id="themebar" role="group" aria-label="Tema">

      </button>

  <nav class="column column--right" aria-label="Prosjekter">

        <svg viewBox="0 0 16 16" width="9" height="9" aria-hidden="true"><path d="M11.3 1.8l2.9 2.9-8.1 8.1-3.6.7.7-3.6z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg>
      </button>

  <div class="sentence" id="sentence"></div>

  <div class="cards">

    <a class="card" id="card-assessment" href="/vurderinger">
      <div class="card-icon" aria-hidden="true">↗</div>
      <div class="card-label" id="assessment-label">Neste vurdering</div>
      <div class="card-count">
        <div class="card-number" id="assessment-days">–</div>
        <div class="card-unit" id="assessment-unit" hidden>dager</div>
      </div>

    </a>

    <div class="card" id="card-plan">
      <div class="card-label" id="plan-label">På planen i dag</div>
      <div class="card-lines">
        <div class="card-primary" id="plan-primary">–</div>
        <div class="card-secondary" id="plan-secondary" hidden></div>
      </div>
      <div class="card-footnote" id="plan-footnote"></div>
    </div>

  </div>

</div>

<script>
'use strict';

/* ══════════════════════════════════════════════════════════════════════
   1. TID OG DATO — alt regnes i Europe/Oslo
   ══════════════════════════════════════════════════════════════════ */

const fmtTime  = new Intl.DateTimeFormat('nb-NO', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false });
const fmtLong  = new Intl.DateTimeFormat('nb-NO', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' });
const fmtShort = new Intl.DateTimeFormat('nb-NO', { timeZone: TZ, day: 'numeric', month: 'short' });
const fmtWeekday = new Intl.DateTimeFormat('nb-NO', { timeZone: TZ, weekday: 'long' });
// sv-SE gir ISO-formen YYYY-MM-DD, som er den enkleste veien til en
// dato-nøkkel i riktig tidssone.
const fmtISO = new Intl.DateTimeFormat('sv-SE', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });

const capitalize = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

/** Dato-nøkkel (YYYY-MM-DD) i Oslo-tid for et gitt tidspunkt. */
function osloDate(d = new Date()) {
  return fmtISO.format(d);
}

/** YYYY-MM-DD → UTC-midnatt. Brukes bare til døgnaritmetikk, aldri til visning. */
function toUtc(dateKey) {
  const [y, m, d] = dateKey.split('-').map(Number);
  return Date.UTC(y, m - 1, d);
}

/** Antall hele døgn fra i dag til en YYYY-MM-DD-dato. Regnes lokalt, uten nett. */
function daysUntil(dateKey) {
  return Math.round((toUtc(dateKey) - toUtc(osloDate())) / 86400000);
}

/** ISO-ukenummer for en YYYY-MM-DD-dato. */
function isoWeek(dateKey) {
  const dt = new Date(toUtc(dateKey));
  const day = dt.getUTCDay() || 7;          // mandag = 1 … søndag = 7
  dt.setUTCDate(dt.getUTCDate() + 4 - day); // torsdag i samme uke
  const jan1 = Date.UTC(dt.getUTCFullYear(), 0, 1);
  return Math.ceil(((dt - jan1) / 86400000 + 1) / 7);
}

function addDays(dateKey, n) {
  return new Date(toUtc(dateKey) + n * 86400000).toISOString().slice(0, 10);
}

/** Mandag i samme ISO-uke, som YYYY-MM-DD. */
function mondayOf(dateKey) {
  return addDays(dateKey, -((new Date(toUtc(dateKey)).getUTCDay() || 7) - 1));
}

/** «13. aug.» → «13. aug». Kl. 12 UTC så Oslo-dagen aldri bikker over. */
function shortDate(dateKey) {
  return fmtShort.format(toUtc(dateKey) + 12 * 3600000).replace(/\.$/, '');
}

function weekdayOf(dateKey) {
  return fmtWeekday.format(toUtc(dateKey) + 12 * 3600000);
}

/* ── Klokke ──────────────────────────────────────────────────────── */

const elTime = document.getElementById('clock-time');
const elDate = document.getElementById('clock-date');
let renderedDay = null;

function renderClock() {
  const now = new Date();
  elTime.textContent = fmtTime.format(now);

  const key = osloDate(now);
  if (key !== renderedDay) {
    elDate.textContent = capitalize(fmtLong.format(now));
    // Dagen har rullet: nedtellingen og dagens økter må regnes på nytt.
    if (renderedDay !== null) renderFromCache();
    renderedDay = key;
  }
}

function startClock() {
  renderClock();
  // Oppdater ved minuttskifte, ikke hvert sekund.
  setTimeout(function tick() {
    renderClock();
    setInterval(renderClock, 60000);
  }, 60000 - (Date.now() % 60000) + 50);
}

/* ══════════════════════════════════════════════════════════════════════
   2. TEMA
   ══════════════════════════════════════════════════════════════════ */

const themebar = document.getElementById('themebar');

function resolveTheme(choice) {
  if (choice === 'light' || choice === 'dark') return choice;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function applyTheme(choice) {
  const root = document.documentElement;
  const resolved = resolveTheme(choice);
  root.dataset.themeChoice = choice;

  if (root.dataset.theme !== resolved) {
    root.dataset.theme = resolved;
    const bg = BACKGROUNDS[resolved];
    document.getElementById('bg-avif').srcset = bg.avif;
    document.getElementById('bg-webp').srcset = bg.webp;
    document.getElementById('bg-img').src = bg.webp;
  }

  for (const btn of themebar.children) {
    btn.setAttribute('aria-pressed', String(btn.dataset.choice === choice));
  }
}

themebar.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  try { localStorage.setItem(LS.theme, btn.dataset.choice); } catch (_) {}
  applyTheme(btn.dataset.choice);
});

// «Auto» skal følge systemet mens siden står åpen.
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (document.documentElement.dataset.themeChoice === 'auto') applyTheme('auto');
});

applyTheme(document.documentElement.dataset.themeChoice || 'auto');

/* ══════════════════════════════════════════════════════════════════════
   3. SNARVEIER OG PROSJEKTER

   Standardverdiene kommer fra SHORTCUTS/PROJECTS i CONFIG-blokket øverst.
   Så snart du redigerer via blyantknappen ved kolonneetiketten lagres
   ditt eget sett i localStorage og vinner over CONFIG — inkludert hvis du
   bevisst tømmer en liste helt. Bare et helt urørt localStorage-felt (du
   har aldri åpnet editoren) faller tilbake til CONFIG-standarden.
   ══════════════════════════════════════════════════════════════════ */

const EDITOR_TARGETS = {
  shortcuts: { lsKey: 'shortcuts', selector: '.column--left',  fallback: SHORTCUTS, title: 'Rediger snarveier' },
  projects:  { lsKey: 'projects',  selector: '.column--right', fallback: PROJECTS,  title: 'Rediger prosjekter' },
};

function loadList(kind) {
  const t = EDITOR_TARGETS[kind];
  const stored = lsGet(LS[t.lsKey]);
  return Array.isArray(stored) ? stored : t.fallback;
}

function renderColumn(selector, items) {
  const col = document.querySelector(selector);
  col.querySelectorAll('.tile').forEach(n => n.remove());
  for (const item of items) {
    const a = document.createElement('a');
    a.className = 'tile';
    a.href = item.url;
    a.textContent = item.label;
    col.appendChild(a);
  }
}

renderColumn('.column--left', loadList('shortcuts'));
renderColumn('.column--right', loadList('projects'));

/**
 * Liten editor for snarveier/prosjekter — navn + URL, ingen egen stor knapp
 * på skjermen, bare blyantikonet ved kolonneetiketten. Bygges i DOM først
 * når den faktisk åpnes, så den koster ingenting på vanlig innlasting.
 */
function openListEditor(kind) {
  const t = EDITOR_TARGETS[kind];
  const items = loadList(kind).map(i => ({ label: i.label || '', url: i.url || '' }));

  const overlay = document.createElement('div');
  overlay.className = 'editor-overlay';

  const panel = document.createElement('div');
  panel.className = 'editor-panel';
  panel.setAttribute('role', 'dialog');
  panel.setAttribute('aria-modal', 'true');
  panel.setAttribute('aria-label', t.title);

  const title = document.createElement('div');
  title.className = 'editor-title';
  title.textContent = t.title;

  const rows = document.createElement('div');
  rows.className = 'editor-rows';

  function addRow(item) {
    const row = document.createElement('div');
    row.className = 'editor-row';

    const name = document.createElement('input');
    name.type = 'text';
    name.className = 'editor-input';
    name.placeholder = 'Navn';
    name.value = item.label;

    const url = document.createElement('input');
    url.type = 'text';
    url.className = 'editor-input';
    url.placeholder = 'URL';
    url.value = item.url;

    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'editor-remove';
    remove.setAttribute('aria-label', 'Fjern');
    remove.textContent = '×';
    remove.addEventListener('click', () => row.remove());

    row.append(name, url, remove);
    rows.appendChild(row);
    return row;
  }

  items.forEach(addRow);
  if (!items.length) addRow({ label: '', url: '' });

  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'editor-add';
  addBtn.textContent = '+ Legg til';
  addBtn.addEventListener('click', () => {
    addRow({ label: '', url: '' }).querySelector('input').focus();
  });

  const cancelBtn = document.createElement('button');
  cancelBtn.type = 'button';
  cancelBtn.className = 'editor-cancel';
  cancelBtn.textContent = 'Avbryt';

  const saveBtn = document.createElement('button');
  saveBtn.type = 'button';
  saveBtn.className = 'editor-save';
  saveBtn.textContent = 'Lagre';

  const actions = document.createElement('div');
  actions.className = 'editor-actions';
  actions.append(cancelBtn, saveBtn);

  panel.append(title, rows, addBtn, actions);
  overlay.appendChild(panel);
  document.body.appendChild(overlay);

  function close() {
    document.removeEventListener('keydown', onKey);
    overlay.remove();
  }

  function onKey(e) {
    if (e.key === 'Escape') close();
  }

  document.addEventListener('keydown', onKey);
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  cancelBtn.addEventListener('click', close);

  saveBtn.addEventListener('click', () => {
    const next = [...rows.querySelectorAll('.editor-row')].map(row => {
      const [nameEl, urlEl] = row.querySelectorAll('.editor-input');
      const label = nameEl.value.trim();
      let url = urlEl.value.trim();
      if (url && !/^[a-z][a-z0-9+.-]*:/i.test(url)) url = 'https://' + url;
      return { label, url };
    }).filter(i => i.label && i.url);

    lsSet(LS[t.lsKey], next);
    renderColumn(t.selector, next);
    close();
  });

  const firstInput = rows.querySelector('.editor-input');
  if (firstInput) firstInput.focus();
}

document.querySelectorAll('.column-edit').forEach(btn => {
  btn.addEventListener('click', () => openListEditor(btn.dataset.kind));
});

/* ══════════════════════════════════════════════════════════════════════
   4. LAGRING
   ══════════════════════════════════════════════════════════════════ */

function lsGet(key) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
  catch (_) { return null; }
}

function lsSet(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {}
}

/* ══════════════════════════════════════════════════════════════════════
   5. GOOGLE CALENDAR

   Ett langt hent (12 måneder fram) per døgn, cachet i localStorage.
   Nedtellingen regnes lokalt fra cachet dato, så «12 dager» blir «11 dager»
   i morgen uten et eneste nettverkskall.
   ══════════════════════════════════════════════════════════════════ */

function loadToken() {
  const t = lsGet(LS.gtoken);
  return t && t.token && t.expires > Date.now() ? t.token : null;
}

function saveToken(resp) {
  lsSet(LS.gtoken, { token: resp.access_token, expires: Date.now() + (resp.expires_in - 120) * 1000 });
}

function clearToken() {
  try { localStorage.removeItem(LS.gtoken); } catch (_) {}
}

/**
 * Henter alle hendelser i et kalendervindu, med paginering.
 *
 * VIKTIG: ikke legg til `fields=` på denne URL-en. Vurderinger identifiseres
 * på `colorId === "11"` (Tomato), og et partielt svar som ikke lister colorId
 * fjerner fargedataen — filtreringen feiler da helt stille og kortet står tomt.
 * (Samme fallgruve som `condenseEventDetails=True` i Google Calendar-
 * konnektoren; her er den fulle hendelsesressursen standard, så det holder
 * å la være å beskjære svaret.)
 */
async function fetchCalendar(token, calendarId, timeMin, timeMax) {
  const items = [];
  let pageToken = '';

  do {
    const url = new URL(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calendarId)}/events`);
    url.searchParams.set('singleEvents', 'true');
    url.searchParams.set('orderBy', 'startTime');
    url.searchParams.set('timeMin', timeMin);
    url.searchParams.set('timeMax', timeMax);
    url.searchParams.set('maxResults', '250');
    url.searchParams.set('timeZone', TZ);
    if (pageToken) url.searchParams.set('pageToken', pageToken);

    const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) throw new Error(String(res.status));
    const data = await res.json();
    items.push(...(data.items || []));
    pageToken = data.nextPageToken || '';
  } while (pageToken);

  return items;
}

/** Startdato (YYYY-MM-DD) for en hendelse, uansett heldags eller tidsatt. */
function eventDate(ev) {
  if (ev.start?.date) return ev.start.date;
  if (ev.start?.dateTime) return osloDate(new Date(ev.start.dateTime));
  return null;
}

function isLive(ev) {
  return ev.status !== 'cancelled' && Boolean(ev.start?.date || ev.start?.dateTime);
}

async function loadCalendarData(token) {
  const today = osloDate();
  const timeMin = new Date(`${today}T00:00:00Z`).toISOString();
  const end = new Date(`${today}T00:00:00Z`);
  end.setUTCMonth(end.getUTCMonth() + CAL_WINDOW_MONTHS);
  const timeMax = end.toISOString();

  const [skole, styrke, loping] = await Promise.all([
    fetchCalendar(token, CAL.skole, timeMin, timeMax),
    fetchCalendar(token, CAL.styrke, timeMin, timeMax),
    fetchCalendar(token, CAL.loping, timeMin, timeMax),
  ]);

  const assessments = skole
    .filter(ev => isLive(ev) && ev.colorId === ASSESSMENT_COLOR_ID)
    .map(ev => ({ date: eventDate(ev), title: ev.summary || 'Vurdering' }))
    .filter(a => a.date)
    .sort((a, b) => a.date.localeCompare(b.date));

  const toSession = ev => ({ date: eventDate(ev), title: ev.summary || '' });
  const sessions = {
    styrke: styrke.filter(isLive).map(toSession).filter(s => s.date && s.title).sort((a, b) => a.date.localeCompare(b.date)),
    loping: loping.filter(isLive).map(toSession).filter(s => s.date && s.title).sort((a, b) => a.date.localeCompare(b.date)),
  };

  return { assessments, sessions, fetchedAt: Date.now(), fetchedFor: today };
}

/* ══════════════════════════════════════════════════════════════════════
   6. RENDERING AV KORTENE
   ══════════════════════════════════════════════════════════════════ */

const el = {
  assessmentLabel:    document.getElementById('assessment-label'),
  assessmentDays:     document.getElementById('assessment-days'),
  assessmentUnit:     document.getElementById('assessment-unit'),
  assessmentFootnote: document.getElementById('assessment-footnote'),
  planLabel:          document.getElementById('plan-label'),
  planPrimary:        document.getElementById('plan-primary'),
  planSecondary:      document.getElementById('plan-secondary'),
  planFootnote:       document.getElementById('plan-footnote'),
  sentence:           document.getElementById('sentence'),
};

function fadeIn(node) {
  node.classList.remove('fade-in');
  void node.offsetWidth;
  node.classList.add('fade-in');
}

function renderAssessmentCard(cal) {
  const today = osloDate();
  const next = (cal?.assessments || []).find(a => a.date >= today);

  if (!next) {
    el.assessmentLabel.dataset.empty = 'true';
    el.assessmentDays.textContent = '–';
    el.assessmentUnit.hidden = true;
    el.assessmentFootnote.textContent = '–';
    return;
  }

  const days = daysUntil(next.date);
  el.assessmentLabel.dataset.empty = 'false';
  el.assessmentDays.textContent = String(days);
  el.assessmentUnit.hidden = false;
  el.assessmentUnit.textContent = days === 1 ? 'dag' : 'dager';
  el.assessmentFootnote.textContent = `${next.title} · ${shortDate(next.date)}`;
  fadeIn(el.assessmentDays);
}

/** Dagens økter: styrke = hovedlinje, løping = sekundærlinje. */
function todaySessions(cal) {
  const today = osloDate();
  const pick = list => (list || []).filter(s => s.date === today).map(s => s.title);
  return { styrke: pick(cal?.sessions?.styrke), loping: pick(cal?.sessions?.loping) };
}

function renderPlanCard(cal) {
  const today = osloDate();
  const { styrke, loping } = todaySessions(cal);

  el.planFootnote.textContent = `${capitalize(weekdayOf(today))} · uke ${isoWeek(today)}`;

  if (!styrke.length && !loping.length) {
    // Ingen av kalenderne har noe i dag: dempet etikett + tankestrek.
    el.planLabel.dataset.empty = 'true';
    el.planPrimary.textContent = '–';
    el.planSecondary.hidden = true;
    return;
  }

  el.planLabel.dataset.empty = 'false';

  // Er bare én av dem satt opp, vis kun den linjen — i hovedlinjen.
  const primary = styrke.length ? styrke : loping;
  const secondary = styrke.length ? loping : [];

  el.planPrimary.textContent = primary.join(' · ');
  el.planPrimary.title = primary.join(' · ');

  if (secondary.length) {
    el.planSecondary.hidden = false;
    el.planSecondary.textContent = secondary.join(' · ');
    el.planSecondary.title = secondary.join(' · ');
  } else {
    el.planSecondary.hidden = true;
  }

  fadeIn(el.planPrimary);
}

/**
 * Dagens setning. Serveren returnerer én setning; her deles den i to linjer
 * og de to første ordene på linje 2 settes i kursiv for rytme — som i
 * «Fem økter. / *Tolv dager* til R1.»
 */
function renderSentence(text) {
  if (!text) { el.sentence.textContent = ''; return; }

  const trimmed = text.trim();
  const split = trimmed.match(/^(.+?[.!?])\s+(.+)$/);

  if (!split) {
    el.sentence.textContent = trimmed;
  } else {
    const [, first, rest] = split;
    const words = rest.split(' ');
    const em = words.slice(0, 2).join(' ');
    const tail = words.slice(2).join(' ');

    el.sentence.replaceChildren(
      document.createTextNode(first),
      document.createElement('br'),
      Object.assign(document.createElement('em'), { textContent: em }),
      document.createTextNode(tail ? ' ' + tail : ''),
    );
  }
  fadeIn(el.sentence);
}

function renderFromCache() {
  const cal = lsGet(LS.calendar);
  renderAssessmentCard(cal);
  renderPlanCard(cal);

  const cached = lsGet(LS.sentence);
  if (cached && cached.date === osloDate()) renderSentence(cached.sentence);
}

/* ══════════════════════════════════════════════════════════════════════
   7. DAGENS SETNING — én AI-kall per dag, cachet
   ══════════════════════════════════════════════════════════════════ */

function sentenceContext(cal) {
  const today = osloDate();
  const monday = mondayOf(today);
  const sunday = addDays(monday, 6);
  const inWeek = s => s.date >= monday && s.date <= sunday;

  const upcoming = (cal?.assessments || [])
    .filter(a => a.date >= today)
    .slice(0, 3)
    .map(a => ({ title: a.title, days: daysUntil(a.date) }));

  const { styrke, loping } = todaySessions(cal);
  const time = fmtTime.format(new Date()); // "HH:MM" i Oslo-tid

  return {
    date: today,
    weekday: weekdayOf(today),
    week: isoWeek(today),
    time,
    hour: Number(time.slice(0, 2)),
    upcoming,
    todaySessions: [...styrke, ...loping],
    plannedThisWeek:
      (cal?.sessions?.styrke || []).filter(inWeek).length +
      (cal?.sessions?.loping || []).filter(inWeek).length,
  };
}

async function ensureSentence() {
  const today = osloDate();
  const cached = lsGet(LS.sentence);
  if (cached && cached.date === today && cached.sentence) return; // allerede rendret

  try {
    const res = await fetch('/api/ai-feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(sentenceContext(lsGet(LS.calendar))),
    });
    if (!res.ok) return;
    const data = await res.json();
    if (!data.sentence) return;
    lsSet(LS.sentence, { date: today, sentence: data.sentence });
    renderSentence(data.sentence);
  } catch (_) {
    // Stille fallback: forrige dags setning blir stående tom heller enn feil.
  }
}

/* ══════════════════════════════════════════════════════════════════════
   8. OPPKOBLING MOT GOOGLE

   Vi spør aldri om innlogging av seg selv. Cachen brukes så lenge den
   finnes; ny henting skjer bare når (a) cachen er eldre enn et døgn og vi
   fortsatt har et gyldig token, eller (b) du kobler til manuelt (klikk på
   vurderingskortet når det er tomt, «Oppdater»-knappen på /vurderinger,
   eller window.connectGoogle() fra konsollen).
   ══════════════════════════════════════════════════════════════════ */

let tokenClient = null;

function loadGis() {
  return new Promise((resolve, reject) => {
    if (window.google?.accounts?.oauth2) return resolve();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true;
    s.onload = resolve;
    s.onerror = () => reject(new Error('GIS'));
    document.head.appendChild(s);
  });
}

async function getTokenClient() {
  await loadGis();
  if (!tokenClient) {
    tokenClient = window.google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: GOOGLE_SCOPE,
      callback: () => {},
    });
  }
  return tokenClient;
}

async function refreshCalendar(token) {
  try {
    const data = await loadCalendarData(token);
    lsSet(LS.calendar, data);
    renderAssessmentCard(data);
    renderPlanCard(data);
    return true;
  } catch (err) {
    if (String(err.message) === '401') clearToken();
    return false;
  }
}

/** Manuell tilkobling. Krever et brukerklikk (popup). */
async function connectGoogle() {
  const client = await getTokenClient();
  return new Promise(resolve => {
    client.callback = async resp => {
      if (!resp || !resp.access_token) return resolve(false);
      saveToken(resp);
      resolve(await refreshCalendar(resp.access_token));
    };
    client.requestAccessToken();
  });
}
window.connectGoogle = connectGoogle;

/** Bakgrunnsoppfriskning: bare hvis cachen er gammel OG vi har token. */
async function maybeRefreshCalendar() {
  const cal = lsGet(LS.calendar);
  const fresh = cal && Date.now() - cal.fetchedAt < CAL_MAX_AGE_MS;
  if (fresh) return;

  const token = loadToken();
  if (!token) return; // ingen prompt — vi lever videre på cachen
  await refreshCalendar(token);
}

// Er kortet helt uten data, blir selve kortet tilkoblingsknappen i stedet
// for en lenke. Med data oppfører det seg som designet (→ /vurderinger).
document.getElementById('card-assessment').addEventListener('click', e => {
  const cal = lsGet(LS.calendar);
  const today = osloDate();
  const hasData = (cal?.assessments || []).some(a => a.date >= today);
  if (hasData) return;
  e.preventDefault();
  connectGoogle();
});

/* ══════════════════════════════════════════════════════════════════════
   9. ⌘K — kommandopaletten er ikke designet ennå
   ══════════════════════════════════════════════════════════════════ */

function openCommandPalette() {
  // TODO: kommandopaletten er ikke designet ennå. Alt som ikke har en fast
  // plass på skjermen skal bo her — søk, AI-chat, Hevy-statistikk
  // (fetchHevyWorkouts() under), vær, tilkobling mot Google.

document.addEventListener('keydown', e => {

/* ══════════════════════════════════════════════════════════════════════
   10. HEVY — beholdt for ⌘K senere. Ikke koblet til hovedskjermen.
   ══════════════════════════════════════════════════════════════════ */

async function fetchHevyWorkouts(pages = 4, pageSize = 10) {
  const all = [];
  for (let page = 1; page <= pages; page++) {
    try {
      const res = await fetch(`/api/hevy?page=${page}&pageSize=${pageSize}`);
      if (!res.ok) break;
      const data = await res.json();
      const workouts = data.workouts || (Array.isArray(data) ? data : []);
      all.push(...workouts);
      if (workouts.length < pageSize) break;
    } catch (_) { break; }
  }
  lsSet(LS.hevy, { workouts: all, fetchedAt: Date.now() });
  return all;
}
window.fetchHevyWorkouts = fetchHevyWorkouts;

/* ══════════════════════════════════════════════════════════════════════
   11. OPPSTART
   ══════════════════════════════════════════════════════════════════ */

startClock();
renderFromCache();

// Alt nettverksarbeid venter til etter første paint.
requestAnimationFrame(() => {
  setTimeout(() => {
    maybeRefreshCalendar().then(ensureSentence);
  }, 0);
});
